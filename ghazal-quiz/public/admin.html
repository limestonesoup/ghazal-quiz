<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghazal Quiz — Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="authGate" class="container">
    <div class="header"><h1>🔐 Admin Panel</h1></div>
    <div class="card">
      <div class="input-group">
        <label>Admin Key</label>
        <input type="text" id="adminKeyInput" placeholder="Enter admin key..." autofocus>
      </div>
      <button class="btn btn-primary btn-block" onclick="checkAdmin()">Enter</button>
    </div>
  </div>

  <div id="adminPanel" class="container wide hidden">
    <div class="header">
      <h1>🎛️ Quiz Control</h1>
      <p class="subtitle">Phase: <span class="status-badge lobby" id="currentPhase">LOBBY</span> | Players: <strong id="playerCount">0</strong> | Question: <strong id="currentQNum">—</strong></p>
    </div>

    <div class="admin-grid">
      <div>
        <div class="card">
          <h2>🎮 Controls</h2>
          <div class="btn-group" style="flex-direction: column;">
            <button class="btn btn-primary btn-block" onclick="action('lobby')">🏠 Go to Lobby</button>
            <button class="btn btn-success btn-block" onclick="action('startQuestion')">▶️ Start Question</button>
            <button class="btn btn-warning btn-block" onclick="action('showResults')">📊 Show Results</button>
            <button class="btn btn-secondary btn-block" onclick="action('showLeaderboard')">🏆 Show Leaderboard</button>
            <button class="btn btn-primary btn-block" onclick="action('nextQuestion')">⏭️ Next Question</button>
            <div class="divider"></div>
            <button class="btn btn-danger btn-block" onclick="action('finish')">🏁 End Quiz</button>
            <button class="btn btn-danger btn-block" onclick="if(confirm('Reset EVERYTHING?')) action('reset')" style="opacity:0.7;">🗑️ Full Reset</button>
          </div>
        </div>

        <div class="card">
          <h2>📊 Live Stats</h2>
          <p>Answers in: <strong id="answersCount">0</strong> / <strong id="totalPlayers">0</strong></p>
          <div class="timer-bar-container">
            <div class="timer-bar" id="answerBar" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>📝 Questions</h2>
          <div id="questionList"></div>
        </div>

        <div class="card">
          <h2>👥 Players</h2>
          <div id="playersList" class="players-list"></div>
        </div>
      </div>
    </div>

    <div class="card mt-2">
      <h2>➕ Add Question Live</h2>
      <div class="input-group">
        <label>Question</label>
        <input type="text" id="newQ" placeholder="Type question...">
      </div>
      <div class="input-group">
        <label>Type</label>
        <select id="newQType">
          <option value="mcq">MCQ</option>
          <option value="poll">Poll</option>
        </select>
      </div>
      <div class="input-group">
        <label>Options (comma separated)</label>
        <input type="text" id="newQOptions" placeholder="Opt A, Opt B, Opt C, Opt D">
      </div>
      <div class="input-group">
        <label>Correct Index (0-indexed, -1 for poll)</label>
        <input type="number" id="newQCorrect" value="0" min="-1" max="5">
      </div>
      <div class="input-group">
        <label>Points / Time Limit (seconds)</label>
        <div style="display: flex; gap: 10px;">
          <input type="number" id="newQPoints" value="10" placeholder="Points">
          <input type="number" id="newQTime" value="20" placeholder="Time (s)">
        </div>
      </div>
      <button class="btn btn-success btn-block" onclick="addQuestion()">Add Question</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // 🔴 REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🔴 CHANGE YOUR ADMIN KEY HERE
    const ADMIN_KEY = 'ghazal2024shauq';

    let questions = [];
    let currentGameState = {};

    function checkAdmin() {
      const key = document.getElementById('adminKeyInput').value.trim();
      const urlKey = new URLSearchParams(window.location.search).get('key');
      if (key === ADMIN_KEY || urlKey === ADMIN_KEY) {
        document.getElementById('authGate').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        init();
      } else { alert('Wrong key!'); }
    }

    window.onload = () => {
      const urlKey = new URLSearchParams(window.location.search).get('key');
      if (urlKey === ADMIN_KEY) {
        document.getElementById('authGate').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        init();
      }
    };

    async function init() {
      const loadAllQuestions = async () => {
        const resp = await fetch('/questions.json');
        let base = await resp.json();
        const snap = await db.ref('customQuestions').once('value');
        if (snap.val()) base = [...base, ...Object.values(snap.val())];
        questions = base;
        renderQuestionList();
      };
      
      await loadAllQuestions();
      db.ref('customQuestions').on('value', () => loadAllQuestions());

      db.ref('gameState').on('value', snap => {
        currentGameState = snap.val() || {};
        updateStatus();
      });

      db.ref('players').on('value', snap => {
        const players = snap.val() || {};
        const count = Object.keys(players).length;
        document.getElementById('playerCount').textContent = count;
        document.getElementById('totalPlayers').textContent = count;

        const container = document.getElementById('playersList');
        container.innerHTML = '';
        Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)).forEach(([id, p]) => {
          const chip = document.createElement('span');
          chip.className = 'player-chip';
          chip.textContent = `${p.name} (${p.score || 0})`;
          container.appendChild(chip);
        });
      });

      db.ref('gameState/currentQuestion').on('value', snap => {
        const qIdx = snap.val();
        if (qIdx !== null && qIdx !== undefined) {
          db.ref(`answers/${qIdx}`).on('value', asnap => {
            const answers = asnap.val() || {};
            const count = Object.keys(answers).length;
            document.getElementById('answersCount').textContent = count;
            const total = parseInt(document.getElementById('totalPlayers').textContent) || 1;
            document.getElementById('answerBar').style.width = `${(count / total) * 100}%`;
          });
        }
      });
    }

    function updateStatus() {
      const phase = currentGameState.phase || 'lobby';
      const el = document.getElementById('currentPhase');
      el.textContent = phase.toUpperCase();
      el.className = 'status-badge ' + (phase === 'question' ? 'active' : phase === 'results' ? 'results' : phase === 'finished' ? 'finished' : 'lobby');
      const qNum = currentGameState.currentQuestion;
      document.getElementById('currentQNum').textContent = qNum !== undefined ? `${qNum + 1}/${questions.length}` : '—';
      renderQuestionList();
    }

    function renderQuestionList() {
      const container = document.getElementById('questionList');
      container.innerHTML = '';
      const currentQ = currentGameState.currentQuestion;

      questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'question-list-item' + (i === currentQ ? ' current' : '') + (currentQ !== undefined && i < currentQ ? ' done' : '');
        div.innerHTML = `<span class="q-num">${i + 1}</span><span class="q-text">${q.question}</span><span class="q-type">${q.type}</span>`;
        div.onclick = () => jumpToQuestion(i);
        container.appendChild(div);
      });
    }

    async function action(type) {
      const currentQ = currentGameState.currentQuestion || 0;
      switch (type) {
        case 'lobby': await db.ref('gameState').set({ phase: 'lobby', currentQuestion: currentQ }); break;
        case 'startQuestion':
          const qIdx = currentGameState.currentQuestion || 0;
          await db.ref('gameState').set({ phase: 'question', currentQuestion: qIdx, questionStartedAt: Date.now() });
          break;
        case 'showResults': await db.ref('gameState').update({ phase: 'results' }); break;
        case 'showLeaderboard': await db.ref('gameState').update({ phase: 'leaderboard' }); break;
        case 'nextQuestion':
          const next = (currentGameState.currentQuestion || 0) + 1;
          if (next >= questions.length) await db.ref('gameState').set({ phase: 'finished' });
          else await db.ref('gameState').set({ phase: 'lobby', currentQuestion: next });
          break;
        case 'finish': await db.ref('gameState').set({ phase: 'finished' }); break;
        case 'reset':
          await db.ref('gameState').remove();
          await db.ref('players').remove();
          await db.ref('answers').remove();
          await db.ref('customQuestions').remove();
          break;
      }
    }

    async function jumpToQuestion(index) {
      if (confirm(`Jump to Question ${index + 1}?`)) {
        await db.ref('gameState').set({ phase: 'lobby', currentQuestion: index });
      }
    }

    async function addQuestion() {
      const q = {
        id: questions.length + 1,
        type: document.getElementById('newQType').value,
        question: document.getElementById('newQ').value.trim(),
        options: document.getElementById('newQOptions').value.split(',').map(s => s.trim()),
        correct: parseInt(document.getElementById('newQCorrect').value),
        points: parseInt(document.getElementById('newQPoints').value),
        timeLimit: parseInt(document.getElementById('newQTime').value)
      };
      if (!q.question || q.options.length < 2) { alert('Fill in question and at least 2 options!'); return; }
      await db.ref('customQuestions').push(q);
      document.getElementById('newQ').value = '';
      document.getElementById('newQOptions').value = '';
      alert('Question added!');
    }
  </script>
</body>
</html>
