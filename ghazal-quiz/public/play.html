<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghazal Quiz — Play</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">

    <!-- LOBBY SCREEN -->
    <div id="screenLobby">
      <div class="header">
        <h1>✨ Ghazal Workshop</h1>
        <p class="subtitle">Welcome, <span id="playerNameDisplay"></span>!</p>
      </div>
      <div class="card waiting">
        <div class="spinner"></div>
        <h2>Waiting for host to start...</h2>
        <p style="color: var(--text-dim); margin-top: 10px;">The mehfil is about to begin</p>
      </div>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screenQuestion" class="hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span id="qLabel" class="status-badge active">Question 1</span>
          <span id="qType" class="status-badge lobby">MCQ</span>
        </div>
        <div class="timer-bar-container">
          <div class="timer-bar" id="timerBar" style="width: 100%"></div>
        </div>
        <p id="timerText" style="text-align: right; color: var(--text-dim); font-size: 0.9rem;">20s</p>
        <h2 id="questionText" style="font-size: 1.3rem; margin: 20px 0; color: var(--text); line-height: 1.5;"></h2>
        <div class="options-grid" id="optionsContainer"></div>
      </div>
    </div>

    <!-- WAITING SCREEN -->
    <div id="screenWaiting" class="hidden">
      <div class="card waiting">
        <div class="result-icon" id="waitEmoji">⏳</div>
        <h2 id="waitText">Answer submitted!</h2>
        <p style="color: var(--text-dim);">Waiting for the round to end...</p>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screenResult" class="hidden">
      <div class="card text-center">
        <div class="result-icon" id="resultIcon">✅</div>
        <h2 id="resultText">Correct!</h2>
        <div class="points-earned" id="resultPoints">+10 points</div>
        <p style="color: var(--text-dim); margin-top: 12px;" id="resultTotal">Total: 10 pts</p>
      </div>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="screenLeaderboard" class="hidden">
      <div class="card">
        <h2 style="text-align: center;">🏆 Leaderboard</h2>
        <div id="leaderboardList"></div>
        <p style="text-align:center; margin-top: 16px; color: var(--text-dim);" id="yourRank"></p>
      </div>
    </div>

    <!-- FINISHED SCREEN -->
    <div id="screenFinished" class="hidden">
      <div class="card text-center">
        <div class="result-icon">🎉</div>
        <h2>Mehfil Complete!</h2>
        <p class="points-earned" id="finalScore">0</p>
        <p style="color: var(--text-dim);">Thanks for participating!</p>
        <div class="divider"></div>
        <div id="finalLeaderboard"></div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // 🔴 REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const playerId = sessionStorage.getItem('playerId');
    const playerName = sessionStorage.getItem('playerName');

    if (!playerId || !playerName) { window.location.href = '/index.html'; }
    document.getElementById('playerNameDisplay').textContent = playerName;

    let questions = [];
    let timerInterval = null;
    let currentAnswer = null;
    let questionStartTime = null;

    const screens = ['screenLobby', 'screenQuestion', 'screenWaiting', 'screenResult', 'screenLeaderboard', 'screenFinished'];
    function showScreen(id) {
      screens.forEach(s => document.getElementById(s).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    // Load questions dynamically (Base JSON + Realtime added)
    async function loadQuestions() {
      const resp = await fetch('/questions.json');
      let base = await resp.json();
      const snap = await db.ref('customQuestions').once('value');
      if (snap.val()) base = [...base, ...Object.values(snap.val())];
      questions = base;
    }
    loadQuestions();
    db.ref('customQuestions').on('value', () => loadQuestions());

    // Listen to game state
    db.ref('gameState').on('value', snap => {
      const state = snap.val();
      if (!state) { showScreen('screenLobby'); return; }

      const phase = state.phase;
      const qIndex = state.currentQuestion || 0;

      if (phase === 'lobby') showScreen('screenLobby');
      else if (phase === 'question') showQuestion(qIndex, state);
      else if (phase === 'results') showResults(qIndex);
      else if (phase === 'leaderboard') showLeaderboard();
      else if (phase === 'finished') showFinished();
    });

    function showQuestion(qIndex, state) {
      if (currentAnswer !== null && currentAnswer.qIndex === qIndex) {
        showScreen('screenWaiting');
        return;
      }
      currentAnswer = null;
      const q = questions[qIndex];
      if (!q) return;

      document.getElementById('qLabel').textContent = `Question ${qIndex + 1}/${questions.length}`;
      document.getElementById('qType').textContent = q.type === 'poll' ? 'POLL' : 'MCQ';
      document.getElementById('questionText').textContent = q.question;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
        btn.onclick = () => submitAnswer(qIndex, i, q, btn);
        container.appendChild(btn);
      });

      questionStartTime = state.questionStartedAt || Date.now();
      startTimer(q.timeLimit || 20, state.questionStartedAt);
      showScreen('screenQuestion');
    }

    function startTimer(totalSeconds, serverStartTime) {
      clearInterval(timerInterval);
      const bar = document.getElementById('timerBar');
      const text = document.getElementById('timerText');

      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - (serverStartTime || Date.now())) / 1000;
        const remaining = Math.max(0, totalSeconds - elapsed);
        const pct = (remaining / totalSeconds) * 100;

        bar.style.width = pct + '%';
        bar.className = 'timer-bar' + (remaining < 5 ? ' warning' : '');
        text.textContent = Math.ceil(remaining) + 's';

        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        }
      }, 100);
    }

    async function submitAnswer(qIndex, optionIndex, question, btnEl) {
      clearInterval(timerInterval);
      currentAnswer = { qIndex, optionIndex };

      document.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; });
      btnEl.classList.add('selected');

      const timeTaken = (Date.now() - questionStartTime) / 1000;
      let points = 0;

      if (question.type !== 'poll' && optionIndex === question.correct) {
        const timeLimit = question.timeLimit || 20;
        const timeBonus = Math.max(0.5, 1 - (timeTaken / timeLimit) * 0.5);
        points = Math.round((question.points || 10) * timeBonus);
      }

      await db.ref(`answers/${qIndex}/${playerId}`).set({
        answer: optionIndex,
        timeTaken: Math.round(timeTaken * 10) / 10,
        points: points
      });

      if (points > 0) {
        const scoreRef = db.ref(`players/${playerId}/score`);
        const scoreSnap = await scoreRef.once('value');
        await scoreRef.set((scoreSnap.val() || 0) + points);
      }

      document.getElementById('waitEmoji').textContent = question.type === 'poll' ? '📊' : '⏳';
      document.getElementById('waitText').textContent = question.type === 'poll' ? 'Vote submitted!' : 'Answer locked in!';
      showScreen('screenWaiting');
    }

    async function showResults(qIndex) {
      clearInterval(timerInterval);
      const q = questions[qIndex];
      if (!q) return;

      if (q.type === 'poll') {
        document.getElementById('resultIcon').textContent = '📊';
        document.getElementById('resultText').textContent = 'Poll results are in!';
        document.getElementById('resultPoints').textContent = 'No points for polls';
        document.getElementById('resultTotal').textContent = '';
        showScreen('screenResult');
        return;
      }

      const ansSnap = await db.ref(`answers/${qIndex}/${playerId}`).once('value');
      const ans = ansSnap.val();
      const scoreSnap = await db.ref(`players/${playerId}/score`).once('value');
      const totalScore = scoreSnap.val() || 0;

      if (!ans) {
        document.getElementById('resultIcon').textContent = '⏰';
        document.getElementById('resultText').textContent = "Time's up! No answer submitted";
        document.getElementById('resultPoints').textContent = '+0 points';
      } else if (ans.answer === q.correct) {
        document.getElementById('resultIcon').textContent = '🎉';
        document.getElementById('resultText').textContent = 'Correct! Shabash!';
        document.getElementById('resultPoints').textContent = `+${ans.points} points`;
      } else {
        document.getElementById('resultIcon').textContent = '😅';
        document.getElementById('resultText').textContent = `Wrong! Answer was: ${q.options[q.correct]}`;
        document.getElementById('resultPoints').textContent = '+0 points';
      }
      document.getElementById('resultTotal').textContent = `Total: ${totalScore} pts`;
      showScreen('screenResult');
    }

    async function showLeaderboard() {
      clearInterval(timerInterval);
      const snap = await db.ref('players').orderByChild('score').once('value');
      const players = [];
      snap.forEach(child => { players.push({ id: child.key, ...child.val() }); });
      players.sort((a, b) => (b.score || 0) - (a.score || 0));

      const container = document.getElementById('leaderboardList');
      container.innerHTML = '';
      const medals = ['🥇', '🥈', '🥉'];

      players.slice(0, 10).forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'leaderboard-item';
        if (p.id === playerId) div.style.cssText = 'border: 1px solid var(--primary); background: rgba(124,58,237,0.1);';
        div.innerHTML = `
          <span class="rank">${i < 3 ? medals[i] : i + 1}</span>
          <span class="name">${p.name}${p.id === playerId ? ' (You)' : ''}</span>
          <span class="score">${p.score || 0}</span>
        `;
        container.appendChild(div);
      });

      const myRank = players.findIndex(p => p.id === playerId) + 1;
      document.getElementById('yourRank').textContent = myRank > 0 ? `Your rank: #${myRank} of ${players.length}` : '';
      showScreen('screenLeaderboard');
    }

    async function showFinished() {
      clearInterval(timerInterval);
      const scoreSnap = await db.ref(`players/${playerId}/score`).once('value');
      document.getElementById('finalScore').textContent = `${scoreSnap.val() || 0} Points`;

      const snap = await db.ref('players').orderByChild('score').once('value');
      const players = [];
      snap.forEach(child => players.push({ id: child.key, ...child.val() }));
      players.sort((a, b) => (b.score || 0) - (a.score || 0));

      const container = document.getElementById('finalLeaderboard');
      container.innerHTML = '<h3 style="text-align:center; margin-bottom: 16px;">Final Standings</h3>';
      const medals = ['🥇', '🥈', '🥉'];

      players.slice(0, 10).forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'leaderboard-item';
        if (p.id === playerId) div.style.cssText = 'border: 1px solid var(--primary); background: rgba(124,58,237,0.1);';
        div.innerHTML = `
          <span class="rank">${i < 3 ? medals[i] : i + 1}</span>
          <span class="name">${p.name}${p.id === playerId ? ' (You)' : ''}</span>
          <span class="score">${p.score || 0}</span>
        `;
        container.appendChild(div);
      });
      showScreen('screenFinished');
    }
  </script>
</body>
</html>
