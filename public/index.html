<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghazal Quiz — Join</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✨ Ghazal Workshop</h1>
      <p class="subtitle">Live Quiz & Polls</p>
    </div>

    <div class="card" id="joinCard">
      <h2>Enter the Mehfil</h2>
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="nameInput" placeholder="E.g., Mirza, Faiz, etc." maxlength="20" autofocus>
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="joinBtn" onclick="joinGame()">Join Quiz ✦</button>
      <p id="joinError" style="color: var(--danger); margin-top: 12px; text-align: center;" class="hidden"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // 🔴 REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const nameInput = document.getElementById('nameInput');
    nameInput.addEventListener('keypress', e => { if(e.key === 'Enter') joinGame(); });

    async function joinGame() {
      const name = nameInput.value.trim();
      if (!name) { showError('Please enter your name!'); return; }

      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.textContent = 'Joining...';

      try {
        const snap = await db.ref('players').orderByChild('name').equalTo(name).once('value');
        if (snap.exists()) {
          const playerId = Object.keys(snap.val())[0];
          sessionStorage.setItem('playerId', playerId);
          sessionStorage.setItem('playerName', name);
          window.location.href = '/play.html';
          return;
        }

        const ref = db.ref('players').push();
        await ref.set({ name: name, score: 0, joinedAt: firebase.database.ServerValue.TIMESTAMP });

        sessionStorage.setItem('playerId', ref.key);
        sessionStorage.setItem('playerName', name);
        window.location.href = '/play.html';
      } catch (err) {
        console.error(err);
        showError('Error joining. Try again!');
        btn.disabled = false;
        btn.textContent = 'Join Quiz ✦';
      }
    }

    function showError(msg) {
      const el = document.getElementById('joinError');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
