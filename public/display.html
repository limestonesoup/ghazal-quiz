<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghazal Quiz — Display</title>
  <link rel="stylesheet" href="/style.css">
  <style>body { overflow: hidden; } .container { max-width: 1100px; }</style>
</head>
<body>
  <div class="container">
    <div id="dLobby">
      <div class="header">
        <h1 style="font-size: 3.5rem;">✨ Ghazal Workshop</h1>
        <p style="font-size: 1.4rem; color: var(--text-dim); margin-top: 8px;">Join at: <strong style="color: var(--primary-light);" id="siteUrl"></strong></p>
      </div>
      <div class="card text-center">
        <p class="player-count" id="dPlayerCount">0</p>
        <p style="font-size: 1.2rem; color: var(--text-dim);">players joined</p>
        <div class="divider"></div>
        <div class="players-list" id="dPlayersList"></div>
      </div>
    </div>

    <div id="dQuestion" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0;">
        <span class="status-badge active" id="dQLabel" style="font-size: 1rem;">Question 1</span>
        <span class="timer-text" id="dTimer">20</span>
        <span class="status-badge lobby" id="dQType">MCQ</span>
      </div>
      <div class="timer-bar-container" style="height: 12px;">
        <div class="timer-bar" id="dTimerBar" style="width: 100%"></div>
      </div>
      <p class="display-question" id="dQuestionText"></p>
      <div id="dOptions" style="max-width: 800px; margin: 0 auto;"></div>
      <p style="text-align:center; margin-top:15px; color:var(--text-dim);" id="dResponseCount">0 responses</p>
    </div>

    <div id="dResults" class="hidden">
      <div style="text-align:center; padding: 20px 0;"><span class="status-badge results" style="font-size: 1rem;" id="dResLabel">Results</span></div>
      <p class="display-question" id="dResQuestion"></p>
      <div id="dResOptions" style="max-width: 800px; margin: 0 auto;"></div>
    </div>

    <div id="dLeaderboard" class="hidden">
      <div style="text-align: center; padding: 30px 0;"><h1 style="font-size: 2.5rem;">🏆 Leaderboard</h1></div>
      <div id="dLeaderList" style="max-width: 700px; margin: 0 auto;"></div>
    </div>

    <div id="dFinished" class="hidden">
      <div style="text-align: center; padding: 50px 0;">
        <div style="font-size: 6rem;">🎉</div>
        <h1 style="font-size: 3rem; background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Mehfil Complete!</h1>
      </div>
      <div id="dFinalBoard" style="max-width: 700px; margin: 0 auto;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCkjGQBjbaJRwRvUCl83TgA1jcEOxDrMNQ",
      authDomain: "ghazalworkshop-b5855.firebaseapp.com",
      databaseURL: "https://ghazalworkshop-b5855-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ghazalworkshop-b5855",
      storageBucket: "ghazalworkshop-b5855.firebasestorage.app",
      messagingSenderId: "265959846827",
      appId: "1:265959846827:web:e4b71f7dc9dc24efbc58ee",
      measurementId: "G-DR9JRSHV57"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('siteUrl').textContent = window.location.hostname;

    let questions = [];
    let timerInterval = null;
    let gameStateCache = null;
    const optionColors = ['#ef4444', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899'];
    const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

    const dScreens = ['dLobby', 'dQuestion', 'dResults', 'dLeaderboard', 'dFinished'];
    function showDScreen(id) {
      dScreens.forEach(s => document.getElementById(s).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    async function loadQuestions() {
      const resp = await fetch('/questions.json');
      let base = await resp.json();
      const snap = await db.ref('customQuestions').once('value');
      if (snap.val()) base = [...base, ...Object.values(snap.val())];
      questions = base;
    }

    function handleGameState(state) {
      if (!state) { showDScreen('dLobby'); return; }
      const phase = state.phase || 'lobby';
      const qIdx = state.currentQuestion || 0;

      if (phase === 'lobby') { showDScreen('dLobby'); clearInterval(timerInterval); }
      else if (phase === 'question') showDisplayQuestion(qIdx, state);
      else if (phase === 'results') showDisplayResults(qIdx);
      else if (phase === 'leaderboard') showDisplayLeaderboard();
      else if (phase === 'finished') showDisplayFinished();
    }

    loadQuestions().then(() => {
      db.ref('customQuestions').on('value', () => {
        loadQuestions().then(() => { if (gameStateCache) handleGameState(gameStateCache); });
      });
      if (gameStateCache) handleGameState(gameStateCache);
    });

    db.ref('players').on('value', snap => {
      const players = snap.val() || {};
      const arr = Object.entries(players);
      document.getElementById('dPlayerCount').textContent = arr.length;
      const list = document.getElementById('dPlayersList');
      list.innerHTML = '';
      arr.forEach(([id, p]) => {
        const chip = document.createElement('span');
        chip.className = 'player-chip';
        chip.textContent = p.name;
        list.appendChild(chip);
      });
    });

    db.ref('gameState').on('value', snap => {
      gameStateCache = snap.val() || {};
      if (questions.length > 0) handleGameState(gameStateCache);
    });

    function showDisplayQuestion(qIdx, state) {
      const q = questions[qIdx];
      if (!q) return;

      document.getElementById('dQLabel').textContent = `Question ${qIdx + 1} of ${questions.length}`;
      document.getElementById('dQType').textContent = q.type === 'poll' ? '📊 POLL' : '🧠 MCQ';
      document.getElementById('dQuestionText').textContent = q.question;

      const container = document.getElementById('dOptions');
      container.innerHTML = '';
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'display-option';
        div.style.cssText = `border: 2px solid ${optionColors[i]}30; background: ${optionColors[i]}10;`;
        div.innerHTML = `<span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:${optionColors[i]}30;font-weight:800;">${letters[i]}</span><span>${opt}</span>`;
        container.appendChild(div);
      });

      const timeLimit = q.timeLimit || 20;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - (state.questionStartedAt || Date.now())) / 1000;
        const remaining = Math.max(0, timeLimit - elapsed);
        document.getElementById('dTimer').textContent = Math.ceil(remaining);
        document.getElementById('dTimerBar').style.width = `${(remaining / timeLimit) * 100}%`;
      }, 100);

      db.ref(`answers/${qIdx}`).on('value', asnap => {
        const count = asnap.val() ? Object.keys(asnap.val()).length : 0;
        document.getElementById('dResponseCount').textContent = `${count} responses`;
      });
      showDScreen('dQuestion');
    }

    async function showDisplayResults(qIdx) {
      clearInterval(timerInterval);
      const q = questions[qIdx];
      if (!q) return;

      document.getElementById('dResLabel').textContent = `Results — Question ${qIdx + 1}`;
      document.getElementById('dResQuestion').textContent = q.question;

      const snap = await db.ref(`answers/${qIdx}`).once('value');
      const answers = snap.val() || {};
      const counts = new Array(q.options.length).fill(0);
      Object.values(answers).forEach(a => { if (a.answer >= 0 && a.answer < counts.length) counts[a.answer]++; });
      const total = Object.keys(answers).length || 1;

      const container = document.getElementById('dResOptions');
      container.innerHTML = '';

      q.options.forEach((opt, i) => {
        const pct = Math.round((counts[i] / total) * 100);
        const isCorrect = q.type !== 'poll' && i === q.correct;
        const div = document.createElement('div');
        div.className = 'poll-bar-container';
        div.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
            <span style="font-weight:700;color:${optionColors[i]};">${letters[i]}</span>
            <span style="font-weight:500;flex:1;">${opt}</span>
            ${isCorrect ? '<span style="color: var(--success); font-weight: 700;">✓ Correct</span>' : ''}
            <span style="font-weight:700;">${counts[i]} (${pct}%)</span>
          </div>
          <div class="poll-bar-bg">
            <div class="poll-bar-fill" style="width:${pct}%;background:${isCorrect ? 'var(--success)' : optionColors[i]};opacity:0.7;"></div>
          </div>
        `;
        container.appendChild(div);
      });
      showDScreen('dResults');
    }

    async function showDisplayLeaderboard() {
      clearInterval(timerInterval);
      const snap = await db.ref('players').orderByChild('score').once('value');
      const players = [];
      snap.forEach(child => players.push({ id: child.key, ...child.val() }));
      players.sort((a, b) => (b.score || 0) - (a.score || 0));

      const container = document.getElementById('dLeaderList');
      container.innerHTML = '';
      const medals = ['🥇', '🥈', '🥉'];

      players.slice(0, 10).forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'leaderboard-item';
        div.innerHTML = `
          <span class="rank">${i < 3 ? medals[i] : i + 1}</span>
          <span class="name">${p.name}</span>
          <span class="score">${p.score || 0}</span>
        `;
        container.appendChild(div);
      });
      showDScreen('dLeaderboard');
    }

    async function showDisplayFinished() {
      clearInterval(timerInterval);
      const snap = await db.ref('players').orderByChild('score').once('value');
      const players = [];
      snap.forEach(child => players.push({ id: child.key, ...child.val() }));
      players.sort((a, b) => (b.score || 0) - (a.score || 0));

      const container = document.getElementById('dFinalBoard');
      container.innerHTML = '';
      const medals = ['🥇', '🥈', '🥉'];

      players.slice(0, 10).forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'leaderboard-item';
        div.innerHTML = `
          <span class="rank">${i < 3 ? medals[i] : i + 1}</span>
          <span class="name">${p.name}</span>
          <span class="score">${p.score || 0}</span>
        `;
        container.appendChild(div);
      });
      showDScreen('dFinished');
    }
  </script>
</body>
</html>
